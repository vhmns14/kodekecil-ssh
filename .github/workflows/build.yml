name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kodekecil-ssh-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  linux-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev liblzma-dev rpm
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: Build RPM
        run: |
          mkdir -p packaging/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb packaging/rpm/kodekecil-ssh.spec \
            --define "_topdir $(pwd)/packaging/rpmbuild" \
            --define "_bundle $(pwd)/build/linux/x64/release/bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: kodekecil-ssh-rpm
          path: packaging/rpmbuild/RPMS/**/*.rpm
